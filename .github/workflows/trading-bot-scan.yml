name: Premarket trading bot scan

on:
  schedule:
    # GitHub Actions scheduled workflows can be delayed by hours. Trigger earlier + widen gate.
    # Target: 08:00-08:30 ET premarket. Trigger 12:00 UTC (08:00 EDT / 07:00 EST).
    - cron: "0 12 * * 1-5"
    # Target: 09:00 ET premarket. Trigger 13:00 UTC (09:00 EDT / 08:00 EST).
    - cron: "0 13 * * 1-5"
    # Mid-day scan to capture afternoon breakouts. 17:30 UTC = 13:30 EDT / 12:30 EST.
    - cron: "30 17 * * 1-5"
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Single ticker to re-evaluate (leave empty for full scan)'
        required: false
        default: ''

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Gate (premarket 08:00-10:00 ET or midday 13:00-17:00 ET) or manual dispatch
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "manual workflow_dispatch → run"
            exit 0
          fi
          python3 <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          ny = datetime.now(ZoneInfo("America/New_York"))
          if ny.weekday() >= 5:
              print("run=false — weekend")
              open(os.environ["GITHUB_OUTPUT"], "a").write("run=false\n")
              raise SystemExit(0)
          # Widened windows to catch GitHub Actions delays (can be 4-7 hours late).
          # Premarket: 08:00-10:00 ET (was 08:05-09:15)
          premarket_ok = ny.hour == 8
          premarket_extended = ny.hour == 9
          premarket_late = ny.hour == 10  # Catch 2+ hour delays
          # Midday + afternoon: 13:00-17:00 ET (was 13:05-13:55)
          # This catches the 13:00 UTC cron even when delayed 4-7 hours (runs 14:00-17:00 ET)
          midday_ok = ny.hour in [13, 14, 15, 16]
          ok = premarket_ok or premarket_extended or premarket_late or midday_ok
          window = "premarket" if (premarket_ok or premarket_extended or premarket_late) else "midday"
          print(f"NY={ny.isoformat()} gate_ok={ok} window={window} (premarket 08:00-10:00 or midday 13:00-17:00 ET)")
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"run={'true' if ok else 'false'}\n")
          PY

      - name: Checkout code
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Firestore credentials secret
        if: steps.gate.outputs.run == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          if [ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}" ]; then
            echo "::error::Set repository secret GOOGLE_APPLICATION_CREDENTIALS to the full service account JSON. See README.md."
            exit 1
          fi

      - name: Run Trading Bot
        if: steps.gate.outputs.run == 'true'
        env:
          FLEX_API_KEY: ${{ secrets.FLEX_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Optional. Use channel ID (C…) from Slack → channel details if #name gives channel_not_found.
          # If unset, bot uses config.yaml slack.channel (default #trading-signals).
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          TICKER_ARG=""
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            TICKER_ARG="--ticker ${{ github.event.inputs.ticker }}"
          fi
          PYTHONPATH=./src python -m signals_bot.main --config config.yaml $TICKER_ARG
